<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TRACE/COM · Pixel Office V2 (fixture)</title>
  <style>
    :root { --bg: #0a0e1c; --panel: #131a2e; --line: #24304e; --ink: #d7deee; --muted: #8695b8; --ok: #46d17a; --bad: #ff5a5a; --warn: #ffc857; --accent: #7fb2ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    #officeV2Root { display: flex; flex-direction: column; height: 100%; }
    .v2-topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: linear-gradient(180deg, #121a30, #0d1424); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .v2-brand b { font-size: 15px; letter-spacing: 1px; }
    .v2-brand b em { color: var(--accent); font-style: normal; }
    .v2-brand small { display: block; color: var(--muted); font-size: 10px; letter-spacing: 1.5px; }
    .v2-chips { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .v2-chip { display: flex; flex-direction: column; gap: 1px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: #0e1526; min-width: 84px; }
    .v2-chip small { color: var(--muted); font-size: 9px; letter-spacing: 1px; }
    .v2-chip b { font-size: 12px; font-variant-numeric: tabular-nums; }
    .v2-chip.ok b { color: var(--ok); }
    .v2-chip.bad b { color: var(--bad); }
    .v2-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .v2-actions button { background: #1a2440; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 11px; letter-spacing: 1px; cursor: pointer; }
    .v2-actions button:hover { background: #23305a; border-color: var(--accent); }
    .v2-actions button.active { background: #27406e; border-color: var(--accent); }
    .v2-actions button.primary { background: #1f5a3a; border-color: var(--ok); }
    .v2-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #officeV2Canvas { display: block; cursor: grab; image-rendering: pixelated; }
    .v2-status { position: absolute; left: 10px; bottom: 8px; font-size: 10px; letter-spacing: 0.5px; color: var(--muted); background: rgba(8, 12, 24, 0.75); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; max-width: 74vw; }
    .v2-status[data-tone="ok"] { color: var(--ok); }
    .v2-status[data-tone="warn"] { color: var(--warn); }
    .v2-status[data-tone="bad"] { color: var(--bad); }
    .v2-scenario-note { position: absolute; left: 10px; top: 8px; font-size: 10px; color: var(--muted); background: rgba(8, 12, 24, 0.75); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; max-width: 60vw; }
    .office-v2-panel { position: absolute; top: 10px; right: 10px; bottom: 10px; width: 340px; max-width: 92vw; overflow: auto; background: rgba(13, 20, 38, 0.96); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); padding: 12px 14px; }
    .office-v2-panel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .office-v2-panel h2 { margin: 2px 0; font-size: 16px; }
    .office-v2-panel small { color: var(--muted); font-size: 10px; }
    .v2-panel-kicker { color: var(--muted); font-size: 9px; letter-spacing: 1.5px; }
    .office-v2-panel header button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; font-size: 10px; padding: 4px 8px; cursor: pointer; }
    .v2-panel-body h3 { margin: 12px 0 4px; font-size: 10px; letter-spacing: 1.5px; color: var(--accent); border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
    .v2-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 11px; }
    .v2-row span { color: var(--muted); }
    .v2-row b { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="officeV2Root">
    <header class="v2-topbar">
      <div class="v2-brand"><b>TRACE<em>/</em>COM</b><small>PIXEL OFFICE V2 · FIXTURE (SEM BACKEND)</small></div>
      <div class="v2-chips" id="v2Chips"></div>
      <div class="v2-actions">
        <button type="button" data-scenario="A">A · 55 OPEN</button>
        <button type="button" data-scenario="B">B · 37 OPEN</button>
        <button type="button" data-scenario="C">C · 10 OPEN</button>
        <button type="button" data-scenario="D">D · 0 OPEN</button>
        <button type="button" data-scenario="E">E · 0→55</button>
        <button type="button" data-scenario="F">F · 55→0</button>
        <button type="button" id="v2Png" class="primary">BAIXAR PNG</button>
        <button type="button" id="v2Fit">FIT</button>
        <button type="button" id="v2Center">CENTER</button>
        <button type="button" id="v2Focus">FOCUS</button>
        <button type="button" id="v2ZoomIn">+</button>
        <button type="button" id="v2ZoomOut">−</button>
      </div>
    </header>
    <main class="v2-stage">
      <canvas id="officeV2Canvas"></canvas>
      <div class="v2-scenario-note" id="v2ScenarioNote">Cenário A — 55 mercados abertos</div>
      <aside class="office-v2-panel" id="officeV2Panel" hidden></aside>
      <div class="v2-status" id="officeV2Status">FIXTURE PRONTO</div>
    </main>
  </div>
  <script type="module">
    import { bootOfficeV2, mulberry32, hashString } from "/office-v2.js";

    const UNIVERSE_55 = [
      ["EURUSD", "EUR/USD", "NORMAL"], ["USDJPY", "USD/JPY", "NORMAL"], ["GBPUSD", "GBP/USD", "NORMAL"],
      ["AUDUSD", "AUD/USD", "NORMAL"], ["USDCAD", "USD/CAD", "NORMAL"], ["USDCHF", "USD/CHF", "NORMAL"],
      ["EURJPY", "EUR/JPY", "NORMAL"], ["EURGBP", "EUR/GBP", "NORMAL"], ["AUDJPY", "AUD/JPY", "NORMAL"],
      ["GBPJPY", "GBP/JPY", "NORMAL"],
      ["EURUSD", "EUR/USD OTC", "OTC"], ["GBPUSD", "GBP/USD OTC", "OTC"], ["USDJPY", "USD/JPY OTC", "OTC"],
      ["EURGBP", "EUR/GBP OTC", "OTC"], ["GBPJPY", "GBP/JPY OTC", "OTC"], ["AUDUSD", "AUD/USD OTC", "OTC"],
      ["USDCAD", "USD/CAD OTC", "OTC"], ["USDCHF", "USD/CHF OTC", "OTC"], ["EURJPY", "EUR/JPY OTC", "OTC"],
      ["AUDJPY", "AUD/JPY OTC", "OTC"], ["EURAUD", "EUR/AUD OTC", "OTC"], ["EURCHF", "EUR/CHF OTC", "OTC"],
      ["EURCAD", "EUR/CAD OTC", "OTC"], ["EURNZD", "EUR/NZD OTC", "OTC"], ["AUDCAD", "AUD/CAD OTC", "OTC"],
      ["AUDCHF", "AUD/CHF OTC", "OTC"], ["AUDNZD", "AUD/NZD OTC", "OTC"], ["CADJPY", "CAD/JPY OTC", "OTC"],
      ["CADCHF", "CAD/CHF OTC", "OTC"], ["GBPAUD", "GBP/AUD OTC", "OTC"], ["GBPCAD", "GBP/CAD OTC", "OTC"],
      ["GBPCHF", "GBP/CHF OTC", "OTC"], ["GBPNZD", "GBP/NZD OTC", "OTC"], ["NZDCAD", "NZD/CAD OTC", "OTC"],
      ["NZDJPY", "NZD/JPY OTC", "OTC"], ["NZDCHF", "NZD/CHF OTC", "OTC"], ["USDMXN", "USD/MXN OTC", "OTC"],
      ["USDBRL", "USD/BRL OTC", "OTC"], ["USDTRY", "USD/TRY OTC", "OTC"], ["USDZAR", "USD/ZAR OTC", "OTC"],
      ["US30", "US30", "NORMAL"], ["US100", "US100", "NORMAL"], ["US500", "US500", "NORMAL"],
      ["US2000", "US2000", "NORMAL"], ["GER30", "GER30", "NORMAL"], ["UK100", "UK100", "NORMAL"],
      ["JP225", "JP225", "NORMAL"], ["AUS200", "AUS200", "NORMAL"], ["EU50", "EU50", "NORMAL"],
      ["HK33", "HK33", "NORMAL"], ["FR40", "FR40", "NORMAL"], ["SP35", "SP35", "NORMAL"],
      ["XAUUSD", "GOLD", "NORMAL"], ["XAGUSD", "SILVER", "NORMAL"], ["BTCUSD", "BTC/USD OTC", "OTC"],
    ];

    const pick = (rng, values) => values[Math.floor(rng() * values.length) % values.length];
    const round2 = (value) => Math.round(value * 100) / 100;

    function buildMarket(entry, index, openCount, seed) {
      const [canonical, display, marketType] = entry;
      const rng = mulberry32(hashString(`${canonical}:${marketType}:${seed}`));
      const open = index < openCount;
      const enabled = open && index < 12;
      const agentState = open
        ? pick(rng, ["WAIT", "WAIT", "ANALYZING", "WAIT", "SIGNAL", "IN_POSITION", "ORDERING", "ERROR", "WAIT"])
        : "UNAVAILABLE";
      const payout = open ? 78 + Math.floor(rng() * 12) : null;
      const activeId = open ? 1 + Math.floor(rng() * 320) : null;
      const stake = 2;
      const resultRoll = rng();
      const result = open && resultRoll > 0.42 ? pick(rng, ["WIN", "WIN", "LOSS", "WIN", "LOSS", "DRAW"]) : null;
      const profit = result === "WIN" ? round2(stake * ((payout ?? 80) / 100)) : result === "LOSS" ? -stake : 0;
      const settledAt = result ? Date.now() - Math.floor(rng() * 60000) : null;
      const positionOpen = agentState === "IN_POSITION";
      const direction = pick(rng, ["CALL", "PUT"]);
      const score = round2(0.35 + rng() * 0.55);
      return {
        marketKey: `${canonical}:${marketType}`,
        marketType, canonical, symbol: display.replace(" OTC", ""), display,
        enabled, paused: false, maxStake: 100, configuredStake: stake,
        setup: pick(rng, ["TREND_PULLBACK", "BREAKOUT_CONTINUATION", "RANGE_REVERSAL", "MOMENTUM_CONTINUATION"]),
        regime: pick(rng, ["TREND_UP", "TREND_DOWN", "RANGE", "TRANSITION"]),
        brainGeneration: 2, revision: 3, activeId,
        instrumentTypes: ["binary", "turbo"],
        availability: open ? "OPEN" : index % 2 === 0 ? "CLOSED" : "UNAVAILABLE",
        payout, payoutSource: "fixture",
        connectionHealth: { connected: open, lastMessageAt: Date.now(), gaps: 0 },
        serverTime: Date.now(),
        lastTick: open ? { price: 1 + index / 100, ageMs: 180 + Math.floor(rng() * 900), source: "FIXTURE" } : null,
        candles5s: open ? 60 + Math.floor(rng() * 120) : 0,
        featureState: open ? {
          builtAt: Date.now() - 500, fresh: agentState !== "ERROR", freshnessReason: agentState === "ERROR" ? "FEED_STALE" : "OK",
          rsi14: round2(30 + rng() * 40), atr14: round2(0.0001 + rng() * 0.0004), adx14: round2(12 + rng() * 28),
          donchianPosition: round2(rng()), microstructureStreak: Math.floor(rng() * 7) - 3,
        } : null,
        decisionState: {
          action: agentState === "SIGNAL" ? direction : agentState === "IN_POSITION" ? direction : "WAIT",
          reason: agentState === "SIGNAL" ? "CONSENSUS_CONFIRMED" : agentState === "ERROR" ? "FEED_INDISPONIVEL" : "SEM_SETUP_VALIDO",
          confidence: round2(0.3 + rng() * 0.5),
          setup: pick(rng, ["TREND_PULLBACK", "BREAKOUT_CONTINUATION", "RANGE_REVERSAL"]),
          regime: pick(rng, ["TREND_UP", "TREND_DOWN", "RANGE", "TRANSITION"]),
          horizonSeconds: 60, evaluatedAt: Date.now() - 400,
          qualityScore: score, failedChecks: score < 0.55 ? ["ADX_FRACO"] : [],
          entryLocation: pick(rng, ["PULLBACK_MID", "CHANNEL_EDGE", "BREAKOUT_RETEST"]),
          microVeto: score < 0.45 ? "MICRO_CONTRA" : null,
          trigger: agentState === "SIGNAL" ? "pullback concluído" : null,
        },
        positionState: {
          status: positionOpen ? "OPEN" : agentState === "ORDERING" ? "ORDERING" : "IDLE",
          direction: positionOpen || agentState === "ORDERING" ? direction : null,
          entryPrice: positionOpen ? round2(1 + rng()) : null,
          stake: positionOpen ? stake : null,
          brokerOrderId: positionOpen ? `FX-${1000 + index}` : null,
          requestId: null, expirationSec: null, openedAt: positionOpen ? Date.now() - 20000 : null,
          settledAt: null, result: null, profit: null, mode: "PRACTICE",
        },
        settlementState: {
          lastResult: result, lastProfit: result ? profit : null, lastAt: settledAt,
          daily: { wins: result === "WIN" ? 1 : 0, losses: result === "LOSS" ? 1 : 0, draws: result === "DRAW" ? 1 : 0, settledPnl: profit, trades: result ? 1 : 0 },
        },
        indicative: positionOpen ? { state: rng() > 0.5 ? "FAVORABLE" : "UNFAVORABLE", delta: 0.0002, indicativePnl: round2(stake * 0.8), updatedAt: Date.now() } : { state: "NEUTRAL", delta: null, indicativePnl: null, updatedAt: null },
        latency: { serverToReceived: { count: 300, p50: 58, p95: 104, p99: 115, max: 130 }, receivedToNormalized: { count: 300, p50: 0, p95: 0, p99: 0, max: 0 }, normalizedToFeature: { count: 300, p50: 0, p95: 650, p99: 900, max: 990 }, orderAck: { count: 2, p50: 420, p95: 430, p99: 430, max: 430 } },
        stats: { messages: open ? 400 + Math.floor(rng() * 900) : 0, candlesProcessed: open ? 60 + Math.floor(rng() * 120) : 0, duplicates: 0, reorder: 0, gaps: 0, rejected: 0, lastBucketStart: Date.now() - 2500 },
        agentState, agentSince: Date.now() - 3000, agentReason: "FIXTURE",
        agents: open ? {
          at: Date.now() - 400, correlationId: `corr_fixture_${index}`, setup: "TREND_PULLBACK",
          trader: {
            action: agentState === "SIGNAL" ? direction : "WAIT", confidence: round2(0.3 + rng() * 0.5),
            regime: pick(rng, ["TREND_UP", "TREND_DOWN", "TRANSITION"]),
            bias: { channelBias: pick(rng, ["LOW", "MID", "HIGH"]), streakBias: pick(rng, ["UP", "DOWN", "FLAT"]), position: round2(rng()) },
            primaryRisk: pick(rng, ["adx_fraco", "entrada_esticada", "micro_contra", null]),
            supporting: [`rsi14=${round2(40 + rng() * 20)}`], contradicting: [`adx_fraco=${round2(12 + rng() * 10)}`], latencyMs: 1,
          },
          critic: {
            independentAction: agentState === "SIGNAL" ? direction : "WAIT",
            verdict: pick(rng, ["CONFIRM", "CONTEST", "VETO", "CONFIRM"]),
            contradictions: rng() > 0.5 ? ["preco_no_meio_do_canal"] : [], riskFlags: rng() > 0.7 ? ["MICRO_CONTRA"] : [],
            finalRecommendation: agentState === "SIGNAL" ? direction : "WAIT", latencyMs: 1,
          },
          consensus: {
            action: agentState === "SIGNAL" ? direction : "WAIT",
            status: agentState === "SIGNAL" ? "CONFIRMED" : pick(rng, ["NO_CONSENSUS", "VETOED", "PENDING"]),
            reason: agentState === "SIGNAL" ? "TRADER_E_CRITIC_ALINHADOS" : "SEM_CONSENSO", rules: [], confidence: round2(rng() * 0.5), estimatedWinProbability: null, latencyMs: 1,
          },
        } : null,
        entryTiming: open && enabled && rng() > 0.4 ? {
          candidateId: `cand_${index}`, action: direction, status: "PENDING", stage: pick(rng, ["AGUARDANDO JANELA", "REVALIDANDO", "ENVIANDO ORDEM"]),
          createdAt: Date.now() - 9000, targetEntryAt: Date.now() + 4000, targetExpiryAt: Date.now() + 64000, submitAt: Date.now() + 2000,
          revalidatedAt: null, confirmedAt: null, cancelReason: null, entryLeadMs: 2000,
          candidateChangedBeforeEntry: rng() > 0.7, changedFields: [], secondsToRevalidation: 2, secondsToEntry: 4,
        } : null,
        lastTrade: result ? { marketKey: `${canonical}:${marketType}`, brokerOrderId: `FX-${1000 + index}`, direction, stake, result, profit, causalResult: result, mismatch: false, at: settledAt } : null,
        selectionReason: null,
      };
    }

    function buildOffice(openCount, seed, note) {
      const markets = UNIVERSE_55.map((entry, index) => buildMarket(entry, index, openCount, seed));
      const settledMarkets = markets.filter((market) => market.settlementState.lastResult);
      const wins = settledMarkets.filter((market) => market.settlementState.lastResult === "WIN").length;
      const losses = settledMarkets.filter((market) => market.settlementState.lastResult === "LOSS").length;
      const draws = settledMarkets.filter((market) => market.settlementState.lastResult === "DRAW").length;
      const pnl = round2(settledMarkets.reduce((sum, market) => sum + (Number(market.settlementState.lastProfit) || 0), 0));
      let cumulative = 0;
      const equityCurve = settledMarkets.slice(0, 40).map((market, index) => {
        cumulative = round2(cumulative + (Number(market.settlementState.lastProfit) || 0));
        return { at: Date.now() - (settledMarkets.length - index) * 60000, cumulative };
      });
      const openMarkets = markets.filter((market) => market.availability === "OPEN" && market.enabled).length;
      return {
        version: "iq-multi-runtime-v2", at: Date.now(), serverTime: Date.now(),
        connection: { connected: true, host: "fixture.local", connectionId: `fixture-${seed}`, timeValid: true, clockSkewMs: 0, reconnects: 0, healthy: true },
        mode: "PRACTICE",
        modeState: { mode: "PRACTICE", practice: { verified: true, balance: 10000, currency: "USD" }, real: { available: true, balance: 0, currency: "BRL" }, realMode: { realModeEnabled: false, phraseRequired: "OPERAR CONTA REAL", maxStake: null, lastRevokeReason: "FIXTURE" } },
        config: { globalMaxStake: 100, defaultStake: 10, calculatedBankrollStake: 1, hardCap: 100, maxActiveMarkets: 10, autoExecute: true, revision: 9, brainGeneration: 2 },
        activeCount: openMarkets, activeLimit: 10, universeCount: 55,
        portfolio: {
          openPositions: markets.filter((market) => market.positionState.status === "OPEN").map((market) => ({ marketKey: market.marketKey, direction: market.positionState.direction, stake: market.positionState.stake, entryPrice: market.positionState.entryPrice, brokerOrderId: market.positionState.brokerOrderId, openedAt: market.positionState.openedAt, indicative: market.indicative })),
          exposure: [], concentrationWarnings: [],
          settled: { wins, losses, draws, pnl, trades: settledMarkets.length },
          practiceBalance: 10000, realBalance: 0, equityCurve,
        },
        markets,
        signals: [],
        aux: {
          risk: { openPositions: markets.filter((market) => market.positionState.status === "OPEN").length, stakeAtRisk: 0, exposure: [], concentrationWarnings: [], limits: { maxActiveMarkets: 10, maxOpenPerMarket: 1, hardCap: 100 } },
          compliance: { mode: "PRACTICE", armState: { state: openCount > 0 ? "ARMED" : "DISARMED", armed: openCount > 0, connectedAccountType: "PRACTICE", marketDataHealthy: openCount > 0, maxPracticeStakeBrl: 100, disarmReason: null }, killSwitch: { executionEnabled: true }, hardCap: 100, realMode: { realModeEnabled: false }, invariants: {} },
          macro: { status: "NO_FEED", note: "fixture" }, news: { status: "NO_FEED", note: "fixture" },
          executionGate: { state: openCount > 0 ? "ARMED" : "DISARMED", armed: openCount > 0, pendingOrders: 0, allowedMarkets: [], blockedMarkets: [], reasons: [] },
          portfolioControl: { activeMarkets: [], openPositions: 0, settledPnl: pnl, wins, losses, draws, agentsOnline: openMarkets * 2 },
        },
        journal: { trades: settledMarkets.length, decisions: settledMarkets.length * 4 },
        metrics: { messages: 9000, candles: 1200, rejected: 0, reconnects: 0, memoryMb: 64, cpuUserMs: 500, uptimeSec: 3600 },
        stress: { running: false, report: null }, eventsCursor: 0,
        fixtureNote: note,
      };
    }

    const SCENARIOS = {
      A: { openCount: 55, seed: 11, note: "Cenário A — 55 mercados abertos" },
      B: { openCount: 37, seed: 22, note: "Cenário B — 37 mercados abertos" },
      C: { openCount: 10, seed: 33, note: "Cenário C — 10 mercados abertos" },
      D: { openCount: 0, seed: 44, note: "Cenário D — nenhum mercado aberto" },
    };

    window.__OFFICE_V2_FIXTURE__ = { office: buildOffice(SCENARIOS.A.openCount, SCENARIOS.A.seed, SCENARIOS.A.note), scenario: "A", scenarios: SCENARIOS };

    const app = bootOfficeV2({
      canvas: "#officeV2Canvas",
      panel: "#officeV2Panel",
      status: "#officeV2Status",
      chips: "#v2Chips",
      fixture: true,
    });

    const noteEl = document.getElementById("v2ScenarioNote");
    const statusEl = document.getElementById("officeV2Status");
    let sequenceTimer = null;

    function applyScenario(office, id, note) {
      window.__OFFICE_V2_FIXTURE__.office = office;
      window.__OFFICE_V2_FIXTURE__.scenario = id;
      app.applyOffice(office);
      if (noteEl) noteEl.textContent = note;
      for (const button of document.querySelectorAll("[data-scenario]")) button.classList.toggle("active", button.dataset.scenario === id);
    }

    function switchScenario(id) {
      if (sequenceTimer) { clearInterval(sequenceTimer); sequenceTimer = null; }
      app.fit();
      if (id === "E" || id === "F") {
        const from = id === "E" ? 0 : 55;
        const to = id === "E" ? 55 : 0;
        const step = id === "E" ? 11 : -11;
        let current = from;
        const render = () => {
          const note = id === "E" ? `Cenário E — reabrindo ${current}/55` : `Cenário F — fechando ${current}/55`;
          applyScenario(buildOffice(current, 55 + Math.abs(current), note), id, note);
        };
        render();
        sequenceTimer = setInterval(() => {
          current += step;
          if ((step > 0 && current > to) || (step < 0 && current < to)) current = to;
          render();
          if (current === to) { clearInterval(sequenceTimer); sequenceTimer = null; if (statusEl) statusEl.textContent = `Cenário ${id} concluído · ${to} abertos`; }
        }, 600);
        return;
      }
      const scenario = SCENARIOS[id];
      applyScenario(buildOffice(scenario.openCount, scenario.seed, scenario.note), id, scenario.note);
    }

    for (const button of document.querySelectorAll("[data-scenario]")) {
      button.addEventListener("click", () => switchScenario(button.dataset.scenario));
    }
    document.getElementById("v2Png")?.addEventListener("click", () => app.downloadPng(`office-v2-fixture-${window.__OFFICE_V2_FIXTURE__.scenario}.png`));
    document.getElementById("v2Fit")?.addEventListener("click", () => app.fit());
    document.getElementById("v2Center")?.addEventListener("click", () => app.center());
    document.getElementById("v2Focus")?.addEventListener("click", () => app.focusStation(app.world.stationByKey.get(app.renderer.selectedMarketKey)));
    document.getElementById("v2ZoomIn")?.addEventListener("click", () => app.zoomBy(2));
    document.getElementById("v2ZoomOut")?.addEventListener("click", () => app.zoomBy(0.5));
  </script>
</body>
</html>
