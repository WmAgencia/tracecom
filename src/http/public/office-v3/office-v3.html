<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>TRACE/COM · PIXEL OFFICE V3</title>
    <link rel="stylesheet" href="./styles-v3.css" />
    <style>
      :root { --navy: #0d1b2e; }
      html, body { margin: 0; height: 100%; background: var(--navy); overflow: hidden; }
      #office-canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <canvas id="office-canvas"></canvas>

    <div id="office-topbar" class="tc-topbar"></div>

    <div id="office-mesas">
      <button id="mesas-toggle" type="button" aria-expanded="false" aria-controls="mesas-panel">MESAS</button>
      <div id="mesas-panel" hidden>
        <input id="mesas-search" type="search" placeholder="buscar mercado…" aria-label="Buscar mercado" autocomplete="off" spellcheck="false" />
        <div id="office-station-list" role="listbox" aria-label="Lista de mercados" tabindex="0"></div>
      </div>
    </div>

    <div id="office-detail-root"></div>
    <div class="hud bottom-left">espaço + arraste para mover · scroll para deslocar (Shift = horizontal) · Ctrl + scroll para zoom no cursor · clique numa mesa</div>
    <div class="hud bottom-right" id="hud-camera">zoom 100%</div>
    <div id="office-tooltip" hidden></div>
    <div id="office-error" hidden></div>

    <div id="office-detail">
      <span class="close" id="detail-close">×</span>
      <h3 id="detail-title">—</h3>
      <div id="detail-rows"></div>
    </div>

    <div id="office-status">
      <div>Carregando PIXEL OFFICE V3…</div>
      <small id="office-status-detail">montando o mundo</small>
    </div>

    <script type="module" src="./office-v3.js"></script>
  </body>
</html>
