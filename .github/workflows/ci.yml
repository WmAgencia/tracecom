name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: (npm ci || npm install)
      - name: Install relay deps
        run: cd relay && (npm install --omit=dev)
      - name: Typecheck + build
        run: npm run build
      - name: Node syntax check (runtime critico)
        run: |
          node --check relay/iq-multi-runtime.mjs
          node --check relay/server.mjs
          node --check relay/execution/single-path.mjs
          node --check relay/execution/intelligence-dispatch.mjs
          node --check relay/intelligence/asset-pipeline.mjs
      - name: Suites + invariantes (fail-closed)
        run: node scripts/run-all-tests.mjs
      - name: Security suites (hermeticas: PGlite/Postgres, edge auth, requestOrder simulado)
        run: npx vitest run tests/security
      - name: Baseline imutavel
        run: node scripts/stage3-strategy-hash-tests.mjs
