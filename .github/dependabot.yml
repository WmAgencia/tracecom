version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      development-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"
    open-pull-requests-limit: 10
    target-branch: main
