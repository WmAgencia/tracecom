<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracecom · Screenshots do painel</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b0e13; color: #e9eef6; padding: 28px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { color: #8b98ac; margin: 0 0 22px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    figure { margin: 0; background: #12161d; border: 1px solid #232a36; border-radius: 16px; overflow: hidden; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: 10px 14px; color: #9aa7ba; font-size: 12px; display: flex; justify-content: space-between; gap: 10px; }
    figcaption b { color: #e9eef6; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Screenshots do painel — Tracecom</h1>
  <p class="sub">Gerados por <code>node telemetry/tools/screenshots.mjs</code> (13 poses · dark/light · desktop/tablet/mobile · settings/histórico · ativo/parado). A auditoria de contraste/overflow está em AUDIT.json.</p>
  <div class="grid" id="grid"></div>
  <script>
    const files = [
      ['desktop-ativo', 'desktop · ativo · 1600x1000'],
      ['desktop-ativo-light', 'desktop · ativo · light'],
      ['desktop-parado', 'desktop · parado'],
      ['desktop-parado-light', 'desktop · parado · light'],
      ['tablet-ativo', 'tablet · ativo · 834x1112'],
      ['tablet-ativo-light', 'tablet · ativo · light'],
      ['mobile-ativo', 'mobile · ativo · 414x896'],
      ['mobile-ativo-light', 'mobile · ativo · light'],
      ['mobile-parado', 'mobile · parado'],
      ['configuracoes', 'configurações · dark'],
      ['configuracoes-light', 'configurações · light'],
      ['historico', 'histórico · dark'],
      ['historico-light', 'histórico · light'],
    ];
    document.getElementById('grid').innerHTML = files.map(([name, label]) => `
      <figure>
        <img src="${name}.png" alt="${label}" loading="lazy" />
        <figcaption><b>${name}</b><span>${label}</span></figcaption>
      </figure>`).join('');
  </script>
</body>
</html>
