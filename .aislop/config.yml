version: 1

# TraceCom — escopo operacional do aislop.
# research/repos sao repositorios externos vendorizados (nao sao nosso codigo).
exclude:
  - node_modules
  - .git
  - dist
  - dist-dev
  - dist-extension
  - .vercel
  - .next
  - research
  - backups
  - data
  - diagnostic-results
  - estrategias

engines:
  format: false
  lint: true
  code-quality: true
  ai-slop: true
  architecture: false
  security: true

quality:
  maxFunctionLoc: 80
  maxFileLoc: 500
  maxNesting: 5
  maxParams: 8

security:
  audit: false
